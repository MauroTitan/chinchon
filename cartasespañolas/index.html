<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinchon Bot Dashboard</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 1rem; text-align: center; max-width: 500px; width: 90%; }
        .status { font-size: 1.2rem; margin: 1rem 0; padding: 0.5rem; border-radius: 0.5rem; }
        .online { background: #065f46; color: #34d399; }
        .offline { background: #7f1d1d; color: #f87171; }
        input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        .log { background: #020617; padding: 1rem; border-radius: 0.5rem; height: 150px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.8rem; margin-top: 1rem; }
        #botUI { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chinchón Bot 🃏</h1>
        <div id="loginForm">
            <input type="text" id="botUser" value="Party">
            <input type="password" id="botPass" value="Titanparty">
            <button onclick="loginBot()">Conectar Bot</button>
        </div>
        <div id="botUI">
            <div id="status" class="status offline">Desconectado</div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'wss://websocket-chat-u0fd.onrender.com';
        const API_URL = 'https://websocket-chat-u0fd.onrender.com/api/login';
        let BOT_NAME = 'Party';
        let BOT_TOKEN = null;
        let JOIN_TIME_LIMIT = 30000;
        // URL FINAL DE TU GITHUB
        const IMAGE_BASE_URL = 'https://raw.githubusercontent.com/MauroTitan/juego-dado/main/'; 

        const numberMap = { 1: 'uno', 2: 'dos', 3: 'tres', 4: 'cuatro', 5: 'cinco', 6: 'seis', 7: 'siete', 10: 'diez', 11: 'once', 12: 'doce' };

        function getCardTag(cardId) {
            const [val, suit] = cardId.split('_');
            const name = numberMap[val] || val;
            const fileName = `${name}de${suit}.png`;
            return `<img src="${IMAGE_BASE_URL}${fileName}" class="chinchon-card" onclick="sendChannelMessage('tirar ${cardId}')" style="cursor:pointer; width:60px; height:auto; margin:2px; border-radius:5px; vertical-align:middle;" title="${val} de ${suit}">`;
        }

        function getCloseTag(cardId) {
            return `<img src="${IMAGE_BASE_URL}cartadecierre.png" class="close-button" onclick="sendChannelMessage('cerrar ${cardId}')" style="cursor:pointer; width:80px; height:auto; margin:2px; vertical-align:middle;" title="Cerrar Juego">`;
        }

        async function loginBot() {
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: document.getElementById('botUser').value, password: document.getElementById('botPass').value })
                });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error);
                BOT_NAME = d.nickname;
                BOT_TOKEN = d.token;
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('botUI').style.display = 'block';
                startBot();
            } catch (err) { alert(err.message); }
        }

        class ChinchonGame {
            constructor(channel) {
                this.channel = channel;
                this.players = []; 
                this.deck = [];
                this.discardPile = [];
                this.currentTurn = 0;
                this.phase = 'draw'; 
                this.status = 'waiting'; 
            }
            initDeck() {
                const suits = ['oro', 'copa', 'espada', 'basto'];
                const values = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
                this.deck = [];
                for (const s of suits) for (const v of values) this.deck.push({ id: `${v}_${s}`, suit: s, value: v });
                this.shuffle(this.deck);
            }
            shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
            start() {
                if (this.players.length < 2) return "Se necesitan al menos 2 jugadores.";
                this.status = 'playing';
                this.initDeck();
                this.discardPile = [];
                for (const p of this.players) { p.hand = []; for (let i = 0; i < 7; i++) p.hand.push(this.deck.pop()); }
                this.discardPile.push(this.deck.pop());
                this.currentTurn = 0;
                this.phase = 'draw';
                return "¡Juego iniciado! Cartas repartidas.";
            }
            addPlayer(n) {
                if (this.status !== 'waiting') return "Juego en curso.";
                if (this.players.find(p => p.nick === n)) return "Ya estás dentro.";
                if (this.players.length >= 4) return "Lleno.";
                this.players.push({ nick: n, hand: [], points: 0 });
                return `${n} se unió. (${this.players.length}/4)`;
            }
            getCurrentPlayer() { return this.players[this.currentTurn]; }
            drawFromDeck(n) {
                const p = this.getCurrentPlayer();
                if (!p || p.nick !== n || this.phase !== 'draw') return "No es tu turno.";
                p.hand.push(this.deck.pop());
                this.phase = 'discard';
                return true;
            }
            drawFromDiscard(n) {
                const p = this.getCurrentPlayer();
                if (!p || p.nick !== n || this.phase !== 'draw') return "No es tu turno.";
                if (this.discardPile.length === 0) return "Mesa vacía.";
                p.hand.push(this.discardPile.pop());
                this.phase = 'discard';
                return true;
            }
            discard(n, id) {
                const p = this.getCurrentPlayer();
                if (!p || p.nick !== n || this.phase !== 'discard') return "No es tu turno.";
                const i = p.hand.findIndex(c => c.id === id);
                if (i === -1) return "No tienes esa carta.";
                const c = p.hand.splice(i, 1)[0];
                this.discardPile.push(c);
                if (p.hand.length === 0) return this.endRound(n, true);
                this.currentTurn = (this.currentTurn + 1) % this.players.length;
                this.phase = 'draw';
                return c;
            }
            close(n, id) {
                const p = this.getCurrentPlayer();
                if (!p || p.nick !== n || this.phase !== 'discard') return "No es tu turno.";
                const i = p.hand.findIndex(c => c.id === id);
                if (i === -1) return "No tienes esa carta.";
                const c = p.hand.splice(i, 1)[0];
                const pts = p.hand.reduce((s, x) => s + (x.value >= 10 ? 10 : x.value), 0);
                if (pts > 10) { p.hand.push(c); return `Puntos (${pts}) altos para cerrar.`; }
                return this.endRound(n, pts === 0, c);
            }
            endRound(w, ch, c) {
                let r = `¡Ronda terminada! ${w} cerró.\n`;
                for (const p of this.players) {
                    let pts = p.hand.reduce((s, x) => s + (x.value >= 10 ? 10 : x.value), 0);
                    if (p.nick === w) pts = ch ? -10 : 0;
                    p.points += pts;
                    r += `${p.nick}: +${pts} (Total: ${p.points})\n`;
                }
                this.players = this.players.filter(p => p.points < 70);
                if (this.players.length <= 1) { r += `Ganador: ${this.players[0] ? this.players[0].nick : 'Nadie'}`; this.status = 'ended'; }
                else { this.status = 'waiting'; r += "Escriban !jugar para otra."; }
                return r;
            }
        }

        class ChinchonBot {
            constructor() { this.ws = null; this.games = new Map(); }
            log(t) { const e = document.createElement('div'); e.textContent = t; document.getElementById('log').appendChild(e); }
            start() {
                this.ws = new WebSocket(SERVER_URL);
                this.ws.onopen = () => {
                    this.log("Bot Online");
                    document.getElementById('status').className = "status online";
                    document.getElementById('status').textContent = "Online";
                    this.ws.send(JSON.stringify({ type: 'connect', nickname: BOT_NAME, token: BOT_TOKEN }));
                };
                this.ws.onmessage = (e) => {
                    const m = JSON.parse(e.data);
                    if (m.type === 'message') this.handle(m);
                };
            }
            handle(m) {
                const u = m.username; if (u === BOT_NAME) return;
                const t = m.text.toLowerCase().trim();
                const c = m.target.startsWith('#') ? m.target : u;
                const g = this.getGame(c);

                if (t === '!ayuda') {
                    const helpMsg = `<div style="font-family: sans-serif; background-color: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 8px; color: #f1f5f9; line-height: 1.5; max-width: 500px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);">` +
                        `<h3 style="margin-top: 0; color: #38bdf8; font-size: 16px; display: flex; align-items: center; gap: 6px;">🃏 Reglamento del Chinchón 🃏</h3>` +
                        `<p style="margin: 6px 0; font-size: 13px;"><b>Objetivo:</b> Combinar tus 7 cartas en grupos de números iguales o escaleras del mismo palo (mínimo 3 cartas).</p>` +
                        `<h4 style="margin: 8px 0 4px 0; color: #38bdf8; font-size: 14px;">🎮 Comandos de Juego:</h4>` +
                        `<ul style="margin: 0; padding-left: 20px; font-size: 13px;">` +
                        `<li><b>!jugar</b>: Abre el lobby o inicia la partida.</li>` +
                        `<li><b>join</b>: Te une a una partida activa en el lobby.</li>` +
                        `<li><b>!stop</b>: Cancela el lobby o detiene la partida en curso.</li>` +
                        `<li><b>robar</b> (o clic en mazo): Toma una carta del mazo.</li>` +
                        `<li><b>tomar</b> (o clic en mesa): Toma la carta visible de la mesa.</li>` +
                        `<li><b>tirar [carta]</b> (o clic en tu carta): Descarta una carta de tu mano.</li>` +
                        `<li><b>cerrar [carta]</b> (o clic en botón): Termina la ronda.</li>` +
                        `</ul>` +
                        `<h4 style="margin: 8px 0 4px 0; color: #38bdf8; font-size: 14px;">🚪 ¿Cómo cerrar?</h4>` +
                        `<p style="margin: 6px 0; font-size: 13px;">Debes descartar 1 carta y tener en mano como máximo <b>2 cartas sin combinar</b> que sumen <b>3 puntos o menos</b> (ej: un 1 y un 2, o un 3 solo).</p>` +
                        `<h4 style="margin: 8px 0 4px 0; color: #38bdf8; font-size: 14px;">🏆 Puntuación:</h4>` +
                        `<ul style="margin: 0; padding-left: 20px; font-size: 13px;">` +
                        `<li><b>Menos 10 pts (-10):</b> Cerrar con todas las cartas combinadas (0 sueltas).</li>` +
                        `<li><b>Chinchón (-25):</b> Escalera de 7 cartas consecutivas del mismo palo (gana el juego).</li>` +
                        `<li><b>Cartas sueltas:</b> Suman su valor. Las figuras (10, 11, 12) suman 10, 11 y 12 pts respectivamente.</li>` +
                        `<li>Si sumas <b>70 puntos o más</b> quedas eliminado. ¡Último en pie gana!</li>` +
                        `</ul>` +
                        `</div>`;
                    this.send(c, helpMsg);
                } else if (t === '!jugar') {
                    if (g.status === 'ended') {
                        g.status = 'waiting';
                        g.players = [];
                        g.roundNumber = 0;
                    }
                    if (g.status !== 'waiting') {
                        this.send(c, "Ya hay una partida en curso.");
                        return;
                    }
                    this.send(c, "Lobby abierto (30s). Pongan 'join'. Escribe !ayuda para ver las reglas y comandos.");
                    g.joinTimer = setTimeout(() => {
                        g.joinTimer = null;
                        this.send(c, g.start());
                        if (g.status === 'playing') { this.announce(c); this.hands(c); }
                    }, JOIN_TIME_LIMIT);
                } else if (t === 'join') {
                    if (!g.joinTimer) {
                        this.send(c, "No hay ningún lobby activo para unirse. Escribe !jugar para iniciar uno.");
                        return;
                    }
                    this.send(c, g.addPlayer(u));
                } else if (t === 'jugar!') {
                    if (!g.joinTimer) {
                        this.send(c, "No hay ningún lobby activo para iniciar. Escribe !jugar primero.");
                        return;
                    }
                    if (g.joinTimer) clearTimeout(g.joinTimer);
                    g.joinTimer = null;
                    this.send(c, g.start());
                    if (g.status === 'playing') { this.announce(c); this.hands(c); }
                } else if (t === 'tomar') {
                    const r = g.drawFromDiscard(u);
                    if (r === true) { this.send(c, `${u} tomó mesa.`); this.hands(c, u); }
                    else this.send(c, r);
                } else if (t === 'robar') {
                    const r = g.drawFromDeck(u);
                    if (r === true) { this.send(c, `${u} robó.`); this.hands(c, u); }
                    else this.send(c, r);
                } else if (t.startsWith('tirar ')) {
                    const r = g.discard(u, t.split(' ')[1]);
                    if (typeof r === 'string') this.send(c, r);
                    else { this.send(c, `${u} tiró ${getCardTag(r.id)}`); if (g.status === 'playing') { this.announce(c); this.hands(c); } }
                } else if (t.startsWith('cerrar ')) {
                    this.send(c, g.close(u, t.split(' ')[1]));
                } else if (t.includes('@' + BOT_NAME.toLowerCase())) {
                    this.hands(c, u);
                }
            }
            getGame(c) { if (!this.games.has(c)) this.games.set(c, new ChinchonGame(c)); return this.games.get(c); }
            send(t, x) { this.ws.send(JSON.stringify({ type: 'message', target: t, text: x })); }
            notice(t, x) { this.ws.send(JSON.stringify({ type: 'notice', target: t, text: x, isPrivate: true })); }
            announce(c) {
                const g = this.getGame(c); const p = g.getCurrentPlayer(); const top = g.discardPile[g.discardPile.length - 1];
                this.send(c, `Turno de ${p.nick}<br>Mesa: ${getCardTag(top.id)}<br>Escribe 'tomar' o 'robar'.`);
            }
            hands(c, n = null) {
                const g = this.getGame(c); const players = n ? g.players.filter(p => p.nick === n) : g.players;
                for (const p of players) {
                    let h = "Tus cartas: " + p.hand.map(x => getCardTag(x.id)).join(' ');
                    if (g.status === 'playing' && g.getCurrentPlayer().nick === p.nick && g.phase === 'discard') {
                        h += `<br>${getCloseTag(p.hand[0].id)} <- Cerrar con la 1ra o tira una.`;
                    }
                    this.notice(p.nick, h);
                }
            }
        }
        const botInstance = new ChinchonBot();
        function startBot() { botInstance.start(); }
    </script>
</body>
</html>
